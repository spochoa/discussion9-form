<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Add fonts from Adobe fonts or Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    
    <title>Submit Recommendations</title>

    <!-- Add a favicon -->
    <link rel="icon" type="image/png" href="images/263a.png">

</head>
<body>
  <!-- Implement a skip to main! -->
  <div class="skip" ><a href="#main">Skip to Main Content</a></div>
  <main id="main">
    <h1>Submit Recommendations</h1>
    
     <!-- <form action="" method="post"> Connect to formspree.io-->
      <form action="https://formspree.io/f/xnppldjp" method="POST">

    <div class="name">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
    </div>

    <fieldset class="radio">
        <legend>Area of Submission:</legend><br>
        <!-- How can the label and button line up and be easily navigatable? -->
        <div class="radio-option">
          <input type="radio" id="travel" name="interest" value="travel" required>
          <label for="travel">Travel</label><br>
        </div>

        <div class="radio-option">
          <input type="radio" id="recipe" name="interest" value="recipe" tabindex="0">
          <label for="recipe">Recipe</label><br>
        </div>

        <div class="radio-option">
          <input type="radio" id="pets" name="interest" value="pets">
          <label for="pets">Pets</label><br><br>
        </div>

        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea><br><br>

        <label for="image">Upload Image:</label><br>
        <input type="file" id="image" name="image"><br><br>

        <input type="submit" value="Submit">

        <button type="reset">Reset</button>
    </fieldset>
  </form>
  </main>
</form>
</body>
</html>
